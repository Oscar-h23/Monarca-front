<section class="relative"><img [src]="banner" alt="Monarca, atención al cliente" class="w-full h-[340px] sm:h-[480px] object-cover brightness-75"><div class="absolute inset-0 flex items-center justify-center"><h1 class="heading text-5xl sm:text-7xl text-white text-center">Tu opinión importa</h1></div></section>
<main class="max-w-6xl mx-auto px-5 py-16"><div class="text-center mb-14"><p class="uppercase text-xs tracking-[.25em] text-zinc-500">Estamos para ayudarte</p><h2 class="heading text-4xl mt-3">CONTÁCTANOS</h2></div>
 <div class="grid md:grid-cols-2 gap-10 bg-crema p-6 md:p-10"><img [src]="image" alt="Atención personalizada" class="w-full h-full max-h-[430px] object-cover rounded-sm"><form (ngSubmit)="send()" class="space-y-5"><h3 class="heading text-2xl mb-3">Bríndanos tu opinión</h3><div class="grid sm:grid-cols-2 gap-4"><label class="text-sm font-semibold">Nombres<input class="field mt-2" [(ngModel)]="first" name="first" required maxlength="100"></label><label class="text-sm font-semibold">Apellidos<input class="field mt-2" [(ngModel)]="last" name="last" required maxlength="100"></label></div><label class="block text-sm font-semibold">Tu correo<input type="email" class="field mt-2" [(ngModel)]="email" name="email" required maxlength="150"></label><label class="block text-sm font-semibold">Comentario<textarea class="field mt-2" rows="6" [(ngModel)]="comment" name="comment" required maxlength="2000"></textarea></label><button class="btn-dark w-full" type="submit">REDACTAR MENSAJE →</button><p class="text-zinc-500 text-xs">Este formulario abre tu aplicación de correo; el mensaje no se envía automáticamente.</p><p *ngIf="info()" role="status" class="text-sm text-green-700">{{info()}}</p></form></div>
 <div class="grid md:grid-cols-3 gap-8 mt-16 text-center"><section><h3 class="font-semibold uppercase mb-3">Escríbenos</h3><a href="mailto:monarca_atencion@gmail.com" class="underline">monarca_atencion@gmail.com</a></section><section><h3 class="font-semibold uppercase mb-3">Llámanos</h3><a href="tel:+51912675893" class="underline">+51 912 675 893</a></section><section><h3 class="font-semibold uppercase mb-3">Envíos</h3><p>Atención a nivel nacional</p></section></div>
</main>
