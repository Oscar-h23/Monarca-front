
<header class="sticky top-0 z-30 bg-white/95 backdrop-blur border-b border-zinc-100">
 <div class="max-w-7xl mx-auto px-5 min-h-20 flex items-center justify-between gap-3">
  <a routerLink="/" class="flex items-center"><img [src]="logo" alt="Monarca" class="h-11 w-auto max-w-40 object-contain"/></a>
  <nav class="hidden lg:flex gap-7 text-sm uppercase tracking-widest"><a routerLink="/">Inicio</a><a *ngFor="let c of categories" [routerLink]="['/catalogo',c.toLowerCase()]">{{c}}</a><a routerLink="/contacto">Contacto</a><a routerLink="/nosotros">Nosotros</a></nav>
  <div class="flex gap-4 items-center"><a *ngIf="!loggedIn()" routerLink="/login" aria-label="Mi cuenta">Cuenta</a><a *ngIf="loggedIn()" routerLink="/perfil" aria-label="Mi perfil">Mi perfil</a><a *ngIf="loggedIn() && isAdmin()" routerLink="/admin" aria-label="Administración">Panel</a><button *ngIf="loggedIn()" type="button" (click)="logout()" aria-label="Cerrar sesión">Salir</button><a routerLink="/carrito" class="font-semibold" aria-label="Carrito">Bolsa ({{cart.count()}})</a><button type="button" class="lg:hidden text-xl" (click)="menu.set(!menu())" aria-label="Abrir menú">☰</button></div>
 </div>
 <nav *ngIf="menu()" class="lg:hidden flex flex-col gap-3 p-5 border-t bg-white"><a routerLink="/" (click)="menu.set(false)">Inicio</a><a *ngFor="let c of categories" [routerLink]="['/catalogo',c.toLowerCase()]" (click)="menu.set(false)">{{c}}</a><a *ngIf="loggedIn()" routerLink="/perfil" (click)="menu.set(false)">Mi perfil</a><a routerLink="/contacto" (click)="menu.set(false)">Contacto</a><a routerLink="/nosotros" (click)="menu.set(false)">Nosotros</a></nav>
</header><router-outlet></router-outlet>
<footer class="bg-zinc-950 text-white mt-20"><div class="max-w-7xl mx-auto px-5 py-14 grid gap-8 md:grid-cols-3"><div><h3 class="font-semibold mb-4">MONARCA</h3><p>Moda femenina, calzado y accesorios.</p></div><div><h3 class="font-semibold mb-4">CONTACTO</h3><p>912 675 893</p><p>monarca_atencion@gmail.com</p></div><div><h3 class="font-semibold mb-4">EXPLORA</h3><a routerLink="/nosotros">Nosotros</a><p class="text-zinc-400 text-sm mt-5">© 2026 Monarca.</p></div></div></footer>
