
<main class="max-w-6xl mx-auto px-5 py-14"><a routerLink="/" class="text-zinc-500 text-sm">← Volver a la tienda</a><p *ngIf="error()" class="text-red-700 mt-10">{{error()}}</p><div *ngIf="product() as p" class="grid md:grid-cols-2 gap-12 mt-8"><img [src]="p.imagen||fallback" [alt]="p.nombre" class="w-full bg-zinc-100 object-cover aspect-[4/5]"><div class="pt-8"><p class="uppercase tracking-widest text-xs text-zinc-500">{{p.categoria}}</p><h1 class="heading text-4xl mt-3">{{p.nombre}}</h1><p class="text-2xl mt-5">S/ {{(selected()?.precio??p.precioBase) | number:'1.2-2'}}</p><p class="mt-8 text-zinc-600 leading-7">{{p.descripcion}}</p><p class="font-semibold mt-8 mb-3">Selecciona talla y color</p><div class="flex gap-2 flex-wrap"><button *ngFor="let v of available(p)" (click)="selected.set(v)" [class.bg-zinc-900]="selected()?.idVariante===v.idVariante" [class.text-white]="selected()?.idVariante===v.idVariante" class="border px-4 py-3">{{v.talla}} / {{v.color}}</button></div><p *ngIf="!available(p).length" class="text-red-700">Sin stock disponible</p><button class="btn-dark w-full mt-8" [disabled]="!selected()" (click)="add(p)">AGREGAR A LA BOLSA</button><p *ngIf="message()" class="mt-3 text-sm">{{message()}}</p></div></div></main>
