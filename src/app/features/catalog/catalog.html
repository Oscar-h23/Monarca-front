
<main class="mx-auto max-w-7xl min-w-0 px-4 py-8 sm:px-6 sm:py-12"><div class="mb-6 flex flex-wrap items-end justify-between gap-3 sm:mb-8"><div><p class="uppercase tracking-widest text-xs text-zinc-500">Colección Nayeli’s moda</p><h1 class="heading mt-2 break-words text-3xl sm:text-4xl">{{category()}}</h1></div><span class="text-sm text-zinc-500">{{filtered().length}} productos</span></div>
<div class="grid min-w-0 gap-4 md:grid-cols-[220px_minmax(0,1fr)] md:gap-8 lg:grid-cols-[240px_minmax(0,1fr)] lg:gap-10">
<div class="min-w-0">
  <button type="button" class="flex min-h-12 w-full items-center justify-between rounded-xl border border-zinc-200 bg-zinc-50 px-4 py-3 text-sm font-semibold md:hidden"
    (click)="filtersOpen.set(!filtersOpen())" [attr.aria-expanded]="filtersOpen()" aria-controls="catalog-filters">
    <span>Filtros y ordenamiento</span><span aria-hidden="true">{{filtersOpen()?'−':'+'}}</span>
  </button>
  <aside id="catalog-filters" class="mt-3 grid grid-cols-2 gap-3 rounded-xl border border-zinc-200 bg-white p-4 md:sticky md:top-36 md:mt-0 md:!grid md:max-h-[calc(100dvh-165px)] md:grid-cols-1 md:gap-4 md:overflow-y-auto md:border-0 md:p-0"
    [class.hidden]="!filtersOpen()"><label class="col-span-2 block min-w-0 text-sm font-semibold md:col-span-1">Buscar<input class="field mt-2" [(ngModel)]="search" (ngModelChange)="apply()" placeholder="Nombre de producto"></label><label class="block text-sm font-semibold">Precio máximo<input class="field mt-2" type="number" min="0" [(ngModel)]="maxPrice" (ngModelChange)="apply()" placeholder="Sin límite"></label><label class="block text-sm font-semibold">Talla<select class="field mt-2" [(ngModel)]="size" (ngModelChange)="apply()"><option value="">Todas</option><option *ngFor="let s of sizes">{{s}}</option></select></label><label class="block text-sm font-semibold">Color<select class="field mt-2" [(ngModel)]="color" (ngModelChange)="apply()"><option value="">Todos</option><option *ngFor="let c of colors" [value]="c">{{c}}</option></select></label><label class="block text-sm font-semibold">Tipo de producto<select class="field mt-2" [(ngModel)]="kind" (ngModelChange)="apply()"><option value="">Todos</option><option *ngFor="let k of kinds" [value]="k">{{k}}</option></select></label><label class="block text-sm font-semibold">Ordenar<select class="field mt-2" [(ngModel)]="sort" (ngModelChange)="apply()"><option value="relevancia">Relevancia</option><option value="asc">Menor precio</option><option value="desc">Mayor precio</option></select></label><div class="col-span-2 flex flex-wrap items-center justify-between gap-3 md:col-span-1">
  <button type="button" class="min-h-11 text-sm font-semibold underline underline-offset-4" (click)="reset()">Limpiar filtros</button>
  <button type="button" class="min-h-11 rounded-lg bg-zinc-900 px-4 text-sm font-semibold text-white md:hidden" (click)="filtersOpen.set(false)">Ver {{filtered().length}} productos</button>
</div></aside></div>
<div class="min-w-0"><p *ngIf="error()" class="text-red-700 mb-4">{{error()}}</p><div class="grid grid-cols-2 gap-x-3 gap-y-7 sm:gap-x-5 sm:gap-y-9 lg:grid-cols-3"><a *ngFor="let p of filtered()" [routerLink]="['/producto',p.idProducto]" class="group block min-w-0"><img [src]="p.imagen||fallback" [alt]="p.nombre" loading="lazy" class="aspect-[3/4] w-full rounded-lg bg-zinc-100 object-cover"><p class="mt-3 text-[10px] uppercase tracking-wider text-zinc-500 sm:text-xs">{{p.categoria}}</p><h2 class="mt-1 line-clamp-2 text-sm font-semibold leading-snug sm:text-base">{{p.nombre}}</h2><p class="mt-1 text-sm font-medium sm:text-base">S/ {{p.precioBase | number:'1.2-2'}}</p></a></div><p *ngIf="!error()&&!filtered().length" class="py-12">No se encontraron productos.</p></div></div></main>
